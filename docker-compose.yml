version: ‘3.3’
services:
  db:
    image: mongo:4.4

  api:
    build: api_server/.
    command: python -u flask_brevets.py
    ports:
      - "5001:5001"
    volumes:
      - /todo
    environment:
      - DB_PORT_27017_TCP_ADDR=db
    depends_on:
      - db

  frontend:
    build: frontend/.
    command: python -u flask_frontend.py
    ports:
      - "5000:5000"
    environment:
      - API_PORT_5000_TCP_ADDR=api
    depends_on:
      - db
      - api

